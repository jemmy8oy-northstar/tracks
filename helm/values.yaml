# Set this to your app name at scaffold time (e.g. "macro-metrics")
fullnameOverride: "tracks"
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: balenthiran.co.uk
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  tls:
    - hosts:
        - balenthiran.co.uk
      secretName: balenthiran-tls # shared wildcard cert — no per-project TLS setup
registryPrefix: "lhr.ocir.io/lr7uc6l49odc" # shared OCIR namespace
apps:
  - name: backend
    image:
      repository: lhr.ocir.io/lr7uc6l49odc/tracks-backend # Update at scaffold time
      tag: 0.1.7
      pullPolicy: Always
    containerPort: 8080
    replicas: 1
    service:
      port: 80
      targetPort: 8080
    ingress:
      path: /tracks/api # developer replaces 'tracks' at scaffold time
      pathType: Prefix
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    env:
      # The ingress routes /tracks/api here without stripping the prefix.
      - name: PathBase
        value: "/tracks" # developer replaces 'tracks' at scaffold time
      # TLS ends at the ingress, so the request scheme is http. The OAuth redirect URIs
      # are built from this instead, and must match what Strava and Spotify have registered.
      - name: PublicBaseUrl
        value: "https://balenthiran.co.uk/tracks"
      # Created by secret-provisioner from oke-fleet secrets/tracks.json.
      - name: ConnectionStrings__DefaultConnection
        valueFrom:
          secretKeyRef:
            name: tracks-secrets
            key: ConnectionStrings__DefaultConnection
      - name: Strava__ClientId
        valueFrom:
          secretKeyRef:
            name: tracks-secrets
            key: Strava__ClientId
      - name: Strava__ClientSecret
        valueFrom:
          secretKeyRef:
            name: tracks-secrets
            key: Strava__ClientSecret
      - name: Strava__VerifyToken
        valueFrom:
          secretKeyRef:
            name: tracks-secrets
            key: Strava__VerifyToken
      - name: Spotify__ClientId
        valueFrom:
          secretKeyRef:
            name: tracks-secrets
            key: Spotify__ClientId
      - name: Spotify__ClientSecret
        valueFrom:
          secretKeyRef:
            name: tracks-secrets
            key: Spotify__ClientSecret
  - name: frontend
    image:
      repository: lhr.ocir.io/lr7uc6l49odc/tracks-frontend # Update at scaffold time
      tag: 0.1.7
      pullPolicy: Always
    containerPort: 80
    replicas: 1
    service:
      port: 80
      targetPort: 80
    ingress:
      path: /tracks # developer replaces 'tracks' at scaffold time
      pathType: Prefix
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
